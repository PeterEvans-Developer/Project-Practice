<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Styled To-Do List</title>
  <link href="styles.css" rel="stylesheet">
</head>

<body>
<ul class="todo-list">
  <li>
    <input type="checkbox" id="html-project">
    <label for="html-project">Complete HTML project</label>
    <ul class="sub-item">
      <li><a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank">HTML Reference Guide</a></li>
    </ul>
  </li>
  <li>
    <input type="checkbox" id="css-practice">
    <label for="css-practice">Practice CSS styling</label>
    <ul class="sub-item">
      <li><a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/CSS" target="_blank">CSS Documentation</a></li>
    </ul>
  </li>
  <li>
    <input type="checkbox" id="javascript-basics">
    <label for="javascript-basics">Study JavaScript basics</label>
    <ul class="sub-item">
      <li><a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">JavaScript Guide</a></li>
    </ul>
  </li>
  <li>
    <input type="checkbox" id="portfolio-update">
    <label for="portfolio-update">Update portfolio website</label>
    <ul class="sub-item">
      <li><a class="sub-item-link" href="https://pages.github.com/" target="_blank">GitHub Pages Tutorial</a></li>
    </ul>
  </li>
</ul>

</body>

</html>
