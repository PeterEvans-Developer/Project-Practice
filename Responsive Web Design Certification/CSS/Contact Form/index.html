<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Contact Information</h2>
            <label for="name">Full Name<input type="text" id="name" name="full-name" required /></label>
            <label for="email">Email<input type="email" id="email" name="email" required /></label>
            <label for="message">Message<textarea name="textarea" id="message" required></textarea></label>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
